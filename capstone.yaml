run: docker compose up --build
seed: |
  python -m scripts.fetch_dataset
  python -m scripts.batch_image
  python -m scripts.embed_images
  python -m scripts.seed_posts
base_url: http://localhost:8000

endpoints:

  - method: GET
    path: /images
    description: List all tagged images with metadata and low-confidence flags

  - method: GET
    path: /images/{image_id}
    description: Get a single image by ID (returns 404 if not found)

  - method: GET
    path: /posts
    description: List all blog posts

  - method: GET
    path: /posts/{post_id}
    description: Get a single blog post by ID (returns 404 if not found)

  - method: POST
    path: /posts
    description: Create a new blog post (validated by PostCreate schema; 409 on duplicate title, 422 on invalid input)

  - method: GET
    path: /suggestions/{post_id}/
    description: >
      Probes 2, 3, 4 - Ranks all image embeddings against the post embedding by
      cosine similarity, runs the top 5 candidates through the three-check
      Mismatch Guard (subject match, similarity >= 0.33, confidence >= 0.70),
      persists the result in suggestions, and returns either the matched image
      or 'no confident match' with a human-readable rejection reason.

  - method: GET
    path: /reviews
    description: List all persisted suggestions with guard outcomes, rejection reasons, and review decisions

  - method: GET
    path: /reviews/{suggestion_id}
    description: Inspect why a specific suggestion was selected or rejected, along with its review decision

  - method: POST
    path: /reviews/{suggestion_id}
    description: >
      Approve or reject a suggestion. Body: {"decision": "approved"} or
      {"decision": "rejected"}. Returns 404 if not found, 409 if already reviewed,
      422 on invalid decision.

evaluation:
  script: python -m scripts.evaluate
  description: Computes Top-1 Precision (13/15 = 86.67%) against data/eval_labels.json (Probe 5)
